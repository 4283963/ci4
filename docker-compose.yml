version: '3.8'

services:
  # =========================================================
  # 1. 基础设施 - Nacos 注册中心
  # =========================================================
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: cold-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - JVM_XMS=256m
      - JVM_XMX=512m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    networks:
      - cold-net

  # =========================================================
  # 2. 基础设施 - MySQL 8 (存储报警记录 + Nacos元数据)
  # =========================================================
  mysql:
    image: mysql:8.0.33
    container_name: cold-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - TZ=Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_connections=500
      - --innodb_buffer_pool_size=1G
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/mysql_init.sql:/docker-entrypoint-initdb.d/01_cold_chain.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cold-net

  mysql-init:
    image: mysql:8.0.33
    container_name: cold-mysql-init
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./sql/mysql_init.sql:/tmp/mysql_init.sql:ro
    entrypoint: [ "bash", "-c", "mysql -hmysql -uroot -p123456 -e 'CREATE DATABASE IF NOT EXISTS nacos_config DEFAULT CHARSET utf8mb4;' && mysql -hmysql -uroot -p123456 < /tmp/mysql_init.sql" ]
    networks:
      - cold-net

  # =========================================================
  # 3. 基础设施 - Zookeeper (Kafka依赖)
  # =========================================================
  zookeeper:
    image: zookeeper:3.8.1
    container_name: cold-zookeeper
    restart: unless-stopped
    environment:
      - ZOO_MY_ID=1
      - ZOO_SERVERS=server.1=0.0.0.0:2888:3888;2181
      - JVMFLAGS=-Xmx256m -Xms256m
    ports:
      - "2181:2181"
    volumes:
      - zk-data:/data
      - zk-log:/datalog
    networks:
      - cold-net

  # =========================================================
  # 4. 基础设施 - Kafka 消息队列
  # =========================================================
  kafka:
    image: bitnami/kafka:3.4.0
    container_name: cold-kafka
    restart: unless-stopped
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_BROKER_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:19092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:19092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_NUM_PARTITIONS=8
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_LOG_RETENTION_HOURS=168
      - KAFKA_CFG_LOG_SEGMENT_BYTES=1073741824
      - KAFKA_HEAP_OPTS=-Xms512m -Xmx1024m
    ports:
      - "9092:9092"
      - "19092:19092"
    volumes:
      - kafka-data:/bitnami/kafka
    depends_on:
      - zookeeper
    networks:
      - cold-net

  kafka-init:
    image: bitnami/kafka:3.4.0
    container_name: cold-kafka-init
    depends_on:
      - kafka
    entrypoint: [ "bash", "-c", "sleep 15 && /opt/bitnami/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic cold_temperature_data --partitions 8 --replication-factor 1 --config retention.ms=604800000 && echo 'Kafka topic created successfully'" ]
    networks:
      - cold-net

  # =========================================================
  # 5. 基础设施 - ClickHouse 时序数据库
  # =========================================================
  clickhouse:
    image: clickhouse/clickhouse-server:23.3.8.21
    container_name: cold-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=cold_chain
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - TZ=Asia/Shanghai
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    volumes:
      - ch-data:/var/lib/clickhouse
      - ch-logs:/var/log/clickhouse-server
      - ./sql/clickhouse_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./config/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom_config.xml:ro
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.d/custom_users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - cold-net

  # =========================================================
  # 6. 应用服务 - cold-gateway 网关
  # =========================================================
  cold-gateway:
    build:
      context: ./cold-gateway
      dockerfile: Dockerfile
    image: cold-gateway:1.0.0
    container_name: cold-gateway
    restart: unless-stopped
    environment:
      - NACOS_ADDR=nacos:8848
      - JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "8080:8080"
    depends_on:
      - nacos
    networks:
      - cold-net

  # =========================================================
  # 7. 应用服务 - cold-collector 数据采集
  # =========================================================
  cold-collector:
    build:
      context: ./cold-collector
      dockerfile: Dockerfile
    image: cold-collector:1.0.0
    container_name: cold-collector
    restart: unless-stopped
    environment:
      - NACOS_ADDR=nacos:8848
      - KAFKA_ADDR=kafka:9092
      - CLICKHOUSE_ADDR=clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - ALARM_HOST=cold-alarm
      - ALARM_PORT=8082
      - JAVA_OPTS=-Xms512m -Xmx1024m
    ports:
      - "8081:8081"
    depends_on:
      - kafka-init
      - clickhouse
      - nacos
      - cold-alarm
    networks:
      - cold-net

  # =========================================================
  # 8. 应用服务 - cold-alarm 报警服务
  # =========================================================
  cold-alarm:
    build:
      context: ./cold-alarm
      dockerfile: Dockerfile
    image: cold-alarm:1.0.0
    container_name: cold-alarm
    restart: unless-stopped
    environment:
      - NACOS_ADDR=nacos:8848
      - MYSQL_ADDR=mysql:3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "8082:8082"
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      nacos:
        condition: service_started
    networks:
      - cold-net

networks:
  cold-net:
    driver: bridge

volumes:
  mysql-data:
  zk-data:
  zk-log:
  kafka-data:
  ch-data:
  ch-logs:
